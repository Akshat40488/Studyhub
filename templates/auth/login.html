{% extends "base.html" %}

{% block content %}

<div class="min-h-screen flex items-center justify-center px-4 py-10 sm:px-6 lg:px-8 relative overflow-hidden">

    <!-- Decorative Background -->

    <div class="absolute inset-0 pointer-events-none overflow-hidden">

        <div class="absolute -top-32 -left-32 w-72 h-72 rounded-full bg-primary-200/20 blur-3xl"></div>

        <div class="absolute -bottom-32 -right-32 w-80 h-80 rounded-full bg-purple-200/20 blur-3xl"></div>

    </div>


    <!-- Main -->

    <div class="relative w-full max-w-md">


        <!-- Brand -->

        <div class="text-center mb-7">

            <a href="{{ url_for('index') }}" class="inline-flex items-center gap-3 group">

                <div
                    class="w-12 h-12 rounded-2xl bg-primary-600 flex items-center justify-center shadow-lg shadow-primary-600/20 transition-transform group-hover:scale-105">

                    <i data-lucide="book-open" class="w-6 h-6 text-white"></i>

                </div>

                <span class="font-extrabold text-2xl tracking-tight text-secondary-900">
                    StudyHub
                </span>

            </a>

        </div>


        <!-- Heading -->

        <div class="text-center mb-6">

            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-secondary-900">
                Welcome back
            </h1>

            <p class="text-secondary-500 mt-2 text-sm sm:text-base">
                Sign in to continue your learning journey.
            </p>

        </div>


        <!-- Login Card -->

        <div class="card shadow-card">

            <div class="card-body p-6 sm:p-8">


                <!-- Form -->

                <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5" novalidate>


                    <!-- Email -->

                    <div>

                        <label for="email" class="label">
                            Email address
                        </label>

                        <div class="relative">

                            <span
                                class="absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary-400 pointer-events-none">
                                <i data-lucide="mail" class="w-4 h-4"></i>
                            </span>

                            <input type="email" id="email" name="email" class="input pl-11"
                                placeholder="you@example.com" value="{{ form_data.email if form_data else '' }}"
                                required autocomplete="email">

                        </div>

                    </div>


                    <!-- Password -->

                    <div>

                        <div class="flex items-center justify-between mb-1.5">

                            <label for="password" class="label mb-0">
                                Password
                            </label>

                            <a href="#"
                                class="text-xs sm:text-sm font-semibold text-primary-600 hover:text-primary-700 transition-colors">
                                Forgot password?
                            </a>

                        </div>


                        <div class="relative">

                            <span
                                class="absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary-400 pointer-events-none">
                                <i data-lucide="lock" class="w-4 h-4"></i>
                            </span>


                            <input type="password" id="password" name="password" class="input pl-11 pr-12"
                                placeholder="Enter your password" required autocomplete="current-password">


                            <button type="button" onclick="togglePassword('password')"
                                class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-lg flex items-center justify-center text-secondary-400 hover:text-secondary-700 hover:bg-secondary-100 transition-colors"
                                aria-label="Show password">

                                <i data-lucide="eye" class="w-4 h-4" id="password-toggle-icon"></i>

                            </button>

                        </div>

                    </div>


                    <!-- Remember -->

                    <label class="flex items-center gap-2.5 cursor-pointer select-none">

                        <input type="checkbox" name="remember" id="remember"
                            class="w-4 h-4 rounded border-secondary-300 text-primary-600 focus:ring-primary-500">

                        <span class="text-sm text-secondary-600">
                            Remember me
                        </span>

                    </label>


                    <!-- Submit -->

                    <button type="submit" class="btn-primary w-full py-3.5 text-sm sm:text-base">

                        <i data-lucide="log-in" class="w-4 h-4"></i>

                        Sign In

                    </button>

                </form>


                <!-- Divider -->

                <div class="flex items-center gap-3 my-6">

                    <div class="h-px flex-1 bg-secondary-100"></div>

                    <span class="text-xs text-secondary-400">
                        OR
                    </span>

                    <div class="h-px flex-1 bg-secondary-100"></div>

                </div>


                <!-- Signup -->

                <div class="text-center">

                    <p class="text-sm text-secondary-500">

                        Don't have an account?

                        <a href="{{ url_for('auth.register') }}"
                            class="text-primary-600 hover:text-primary-700 font-semibold transition-colors">
                            Create an account
                        </a>

                    </p>

                </div>

            </div>

        </div>


        <!-- Footer -->

        <div class="text-center mt-6">

            <p class="text-xs text-secondary-400">
                Learn. Practice. Improve.
            </p>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_scripts %}

<script>

    document.addEventListener('DOMContentLoaded', function () {

        /* Icons */

        if (window.lucide) {
            lucide.createIcons();
        }


        /* Focus email */

        document
            .getElementById('email')
            ?.focus();

    });


    /* =========================================================
       PASSWORD VISIBILITY
    ========================================================= */

    function togglePassword(fieldId) {

        const input =
            document.getElementById(fieldId);

        const icon =
            document.getElementById(
                fieldId + '-toggle-icon'
            );


        if (!input || !icon) {
            return;
        }


        if (input.type === 'password') {

            input.type = 'text';

            icon.setAttribute(
                'data-lucide',
                'eye-off'
            );

        } else {

            input.type = 'password';

            icon.setAttribute(
                'data-lucide',
                'eye'
            );

        }


        if (window.lucide) {
            lucide.createIcons();
        }

    }

</script>

{% endblock %}
